# Optional backup trigger for the scheduled jobs (§28.8). cron-job.org is the primary scheduler;
# GitHub may delay or skip scheduled runs and disables them after 60 days without repository activity.
name: Jobs backup

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/jobs/run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOBS_URL: ${{ secrets.JOBS_URL }}
        # Block scalar: a plain YAML value can't contain ": " (it made this whole file invalid).
        run: |
          if [ -z "$JOBS_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "JOBS_URL/CRON_SECRET secrets not set; skipping (this backup scheduler is optional)"; exit 0
          fi
          curl -fsS -m 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "$JOBS_URL"
