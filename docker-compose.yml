# Local PostgreSQL 17 for development (5432) and tests (5433): `npm run db:up`.
# Without Docker, `npm run db:local` starts the same two clusters from embedded binaries.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: campushub
      POSTGRES_PASSWORD: campushub
      POSTGRES_DB: campushub
    ports:
      - '5432:5432'
    volumes:
      - campushub-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campushub -d campushub']
      interval: 5s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: campushub
      POSTGRES_PASSWORD: campushub
      POSTGRES_DB: campushub_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campushub -d campushub_test']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  campushub-db:
